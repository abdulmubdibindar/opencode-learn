lang: id
date-format: "D MMMM YYYY"

language:
  callout-note-title: "Catatan"
  callout-tip-title: "Kiat"
  callout-warning-title: "Perhatian"
  callout-important-title: "Penting"
  callout-caution-title: "Hati-hati"

format:
  typst:
    pdf:
      # no-op placeholder; actual PDF produced at render time
      null: true
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm
    toc: true
    toc-title: "Daftar Isi"
    toc-depth: 2
    fontsize: 10pt
    callout-icon: true
    mainfont: "Carlito"
    sansfont: "Carlito"
    monofont: "JetBrains Mono"
    include-in-header:
      - text: |
          #show heading: set text(font: "Carlito", fill: rgb("#003b59"))
          #show link: set text(fill: rgb("#003b59"))
          #show raw: set text(features: ("liga": 0, "calt": 0))
          #show figure: set block(breakable: true)
          #let callout(body: [], title: "Callout", background_color: rgb("#dddddd"), icon: none, icon_color: black, body_background_color: white) = {
            block(
              breakable: true,
              fill: background_color,
              stroke: (paint: icon_color, thickness: 0.5pt, cap: "round"),
              width: 100%,
              radius: 2pt,
              block(
                inset: 1pt,
                width: 100%,
                below: 0pt,
                block(
                  fill: background_color,
                  width: 100%,
                  inset: 8pt)[#if icon != none [#text(icon_color, weight: 900)[#icon] ]#title]) +
                if(body != []){
                  block(
                    inset: 1pt,
                    width: 100%,
                    block(fill: body_background_color, width: 100%, inset: 8pt, body))
                }
              )
          }
